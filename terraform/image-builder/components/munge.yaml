name: munge
description: Install and configure munge authentication service
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: InstallMunge
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -x
              PKG=$(command -v dnf >/dev/null 2>&1 && echo dnf || echo yum)
              $PKG install -y munge munge-libs munge-devel 2>/dev/null || true
              id -u munge >/dev/null 2>&1 || useradd -r -s /sbin/nologin munge || true
              mkdir -p /etc/munge /var/log/munge /var/lib/munge /run/munge
              if id -u munge >/dev/null 2>&1; then
                chown -R munge:munge /etc/munge /var/log/munge /var/lib/munge /run/munge || true
              fi
              chmod 0700 /etc/munge || true
              # Key is injected at instance bootstrap from Secrets Manager — do not generate here
              systemctl enable munge 2>/dev/null || true
              echo "munge component complete"
