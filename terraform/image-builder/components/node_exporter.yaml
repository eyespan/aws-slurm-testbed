name: node-exporter
description: Install node_exporter for Prometheus
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: InstallNodeExporter
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -x
              VER=1.8.2
              URL="https://github.com/prometheus/node_exporter/releases/download/v${VER}/node_exporter-${VER}.linux-amd64.tar.gz"
              curl -fsSL -o /tmp/node_exporter.tar.gz "$URL" || {
                echo "node_exporter download failed (non-fatal)"
                exit 0
              }
              tar -xzf /tmp/node_exporter.tar.gz -C /tmp
              cp "/tmp/node_exporter-${VER}.linux-amd64/node_exporter" /usr/local/bin/
              chmod 755 /usr/local/bin/node_exporter
              id -u node_exporter >/dev/null 2>&1 || useradd -r -s /sbin/nologin node_exporter || true
              cat >/etc/systemd/system/node_exporter.service <<'EOF'
              [Unit]
              Description=Node Exporter
              After=network.target
              [Service]
              User=node_exporter
              ExecStart=/usr/local/bin/node_exporter
              Restart=always
              [Install]
              WantedBy=multi-user.target
              EOF
              systemctl daemon-reload || true
              systemctl enable node_exporter 2>/dev/null || true
              echo "node_exporter installed"
