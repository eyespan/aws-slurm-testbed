name: al2023-hardening
description: AL2023 security hardening (non-fatal best-effort)
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: DisableUnusedServices
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -x
              systemctl disable --now postfix.service 2>/dev/null || true
              systemctl disable --now rpcbind.service 2>/dev/null || true
              echo "unused services step done"
      - name: HardenSSH
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -x
              if [ -f /etc/ssh/sshd_config ]; then
                sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
                sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config || true
              fi
              echo "ssh harden step done"
