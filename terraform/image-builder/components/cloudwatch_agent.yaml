version: 1.0
name: cloudwatch-agent
description: |
  Install and configure CloudWatch agent for system and Slurm logs.

parameters:
  - cloudwatch_agent_version:
      description: "CloudWatch agent version"
      default: "1.247160.0b240"
  - logs_group_name:
      description: "CloudWatch Logs group name for system logs"
      default: "/hpc-testbed/system-logs"
  - slurm_logs_group_name:
      description: "CloudWatch Logs group name for Slurm logs"
      default: "/hpc-testbed/slurm-logs"

steps:
  - name: DownloadCloudWatchAgent
    action: ExecuteBash
    inputs:
      commands:
        - |
          # Download CloudWatch agent
          cd /tmp
          curl -O "https://s3.amazonaws.com/amazoncloudwatch-agent/amazon_linux/arm64/latest/amazon-cloudwatch-agent.rpm"
          rpm -Uvh amazon-cloudwatch-agent.rpm
          rm -f amazon-cloudwatch-agent.rpm

  - name: ConfigureCloudWatchAgent
    action: ExecuteBash
    inputs:
      commands:
        - |
          # Create CloudWatch agent configuration
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<EOF
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as": "root"
            },
            "metrics": {
              "metrics_collected": {
                "cpu": {
                  "measurement": [
                    "cpu_usage_idle",
                    "cpu_usage_iowait",
                    "cpu_usage_user",
                    "cpu_usage_system"
                  ],
                  "resources": ["*"],
                  "total": true
                },
                "disk": {
                  "measurement": ["used_percent", "free", "total"],
                  "resources": ["/"]
                },
                "mem": {
                  "measurement": ["mem_used_percent", "mem_available", "mem_total"]
                },
                "swap": {
                  "measurement": ["swap_used_percent", "swap_free", "swap_total"]
                }
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/messages",
                      "log_group_name": "${logs_group_name}",
                      "log_stream_name": "{instance_id}/messages"
                    },
                    {
                      "file_path": "/var/log/secure",
                      "log_group_name": "${logs_group_name}",
                      "log_stream_name": "{instance_id}/secure"
                    },
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "${logs_group_name}",
                      "log_stream_name": "{instance_id}/syslog"
                    },
                    {
                      "file_path": "/var/log/slurm/slurmctld.log",
                      "log_group_name": "${slurm_logs_group_name}",
                      "log_stream_name": "{instance_id}/slurmctld"
                    },
                    {
                      "file_path": "/var/log/slurm/slurmd.log",
                      "log_group_name": "${slurm_logs_group_name}",
                      "log_stream_name": "{instance_id}/slurmd"
                    }
                  ]
                }
              }
            }
          }
          EOF

  - name: StartCloudWatchAgent
    action: ExecuteBash
    inputs:
      commands:
        - |
          # Start CloudWatch agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json \
            -a fetch-config
